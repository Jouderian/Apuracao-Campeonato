name: Verificação e Testes

on:
  push:
    branches: [main]
  pull_request:
  # Revisão de segurança semanal (segundas, 06:23 em Brasília): novas vulnerabilidades em
  # dependências aparecem mesmo sem commit. Falha do job notifica quem mantém o repositório.
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

# Permissão mínima: o CI só lê o repositório.
permissions:
  contents: read

jobs:
  verificar:
    name: Integridade documental, SDD, análise estática e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter o repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Preparar o Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências (somente com hash conferido)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Auditar vulnerabilidades conhecidas nas dependências
        run: pip-audit -r requirements-dev.txt

      - name: Executar verificador do projeto (SDD, mypy, ruff, bandit e testes)
        run: python .agents/scripts/verificar-projeto.py
