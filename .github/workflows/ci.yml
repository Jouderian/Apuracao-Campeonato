name: Verificação e Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permissão mínima: o CI só lê o repositório.
permissions:
  contents: read

jobs:
  verificar:
    name: Integridade documental, SDD, análise estática e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter o repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar o Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências (somente com hash conferido)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Auditar vulnerabilidades conhecidas nas dependências
        run: pip-audit -r requirements-dev.txt

      - name: Executar verificador do projeto (SDD, mypy, ruff, bandit e testes)
        run: python .agents/scripts/verificar-projeto.py
