# Atualizações automáticas e revisáveis de dependências e de GitHub Actions (cadeia de suprimentos).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(root)"
    # PyMuPDF 2.x puxa numpy, onnxruntime e networkx sem uso no projeto (ver requirements.in).
    ignore:
      - dependency-name: "pymupdf"
        update-types: ["version-update:semver-major"]
    groups:
      dependencias-python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
